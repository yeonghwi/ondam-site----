<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메뉴 — 온담 한방찻집</title>
  <meta name="description" content="온담 한방찻집의 대표 메뉴 대추생강차 · 쌍화라떼 · 오미자에이드를 소개합니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 위쪽 탭 -->
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="온담 한방찻집"
             onerror="this.replaceWith(document.createTextNode('온담 한방찻집'))">
      </a>
      <nav aria-label="주요 메뉴">
        <ul class="tabs">
          <li><a href="index.html">홈</a></li>
          <li><a href="menu.html" aria-current="page">메뉴</a></li>
          <li><a href="reserve.html">단체 예약</a></li>
          <li><a href="location.html">오시는 길</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- 대표 메뉴 -->
    <section class="section">
      <div class="container">
        <h1>메뉴</h1>
        <p class="section-lead">온담에서 직접 달여 내리는 대표 메뉴 세 가지입니다.</p>

        <ul class="cards">
          <li class="card">
            <img class="card-photo" src="images/menu-jujube-ginger.jpg"
                 width="800" height="800" loading="lazy"
                 alt="나무 탁자 위 도자기 잔에 담긴 진한 대추생강차, 잔 옆에 놓인 말린 대추와 생강">
            <h3 class="menu-name">대추생강차</h3>
            <p>대추와 생강을 오래 달여 깊고 따뜻한 맛</p>
          </li>
          <li class="card">
            <img class="card-photo" src="images/menu-ssanghwa-latte.jpg"
                 width="800" height="800" loading="lazy"
                 alt="도자기 잔에 담긴 쌍화라떼, 우유 거품 위에 얹은 대추 조각과 잣">
            <h3 class="menu-name">쌍화라떼</h3>
            <p>쌍화차에 부드러운 우유를 더한 고소한 한 잔</p>
          </li>
          <li class="card">
            <img class="card-photo" src="images/menu-omija-ade.jpg"
                 width="800" height="800" loading="lazy"
                 alt="얼음과 레몬, 민트를 띄운 붉은 오미자에이드 한 잔과 오미자 열매">
            <h3 class="menu-name">오미자에이드</h3>
            <p>새콤달콤한 오미자에 탄산을 더한 시원한 한 잔</p>
          </li>
        </ul>

        <div class="btn-row">
          <a class="btn btn-primary" href="reserve.html">단체 예약 신청</a>
        </div>
      </div>
    </section>

  </main>

  <!-- 아래쪽 정보 (모든 페이지 똑같이) -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-name">온담 한방찻집</p>
      <dl>
        <dt>주소</dt>
        <dd>경북 경산시 한의대로 1 (대구한의대학교)</dd>
        <dt>영업시간</dt>
        <dd>09:00~18:00 (매주 월요일 휴무)</dd>
        <dt>전화</dt>
        <dd><a href="tel:053-819-1000">053-819-1000</a></dd>
      </dl>
    </div>
  </footer>

</body>
</html>
